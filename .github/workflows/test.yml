name: Automation Tests

on:
  push:
    branches: [main]
  # 정기 실행(schedule)은 비활성 상태다. 자동화 대상 선정과 CI 설정이 확정되고 안정화 기준을
  # 충족해 사용자가 승인하기 전에는 활성화하지 않는다(CLAUDE.md 15·18절). 활성화할 때는
  # ci-agent가 변경안(주기·실행 환경 포함)을 작성하고 사용자 승인을 받는다.
  # 이전 구성: 매일 한국시간(KST, UTC+9) 오후 9시 = UTC 당일 12시(cron "0 12 * * *").
  # GitHub Actions의 schedule은 항상 UTC 기준이며 default 브랜치(main) 최신 커밋 기준으로
  # 실행되고, self-hosted 러너(korea-macos-runner)가 온라인이어야 한다(AUTOMATION_GUIDE 16.3절).
  # schedule:
  #   - cron: "0 12 * * *"

jobs:
  test:
    # store.laftel.net이 한국 외 지역 IP를 차단해(실측 확인, 2026-09-06) GitHub 호스팅
    # 러너(해외 데이터센터)에서는 사이트 접속 자체가 불가능하다. 한국 IP를 가진
    # self-hosted 러너(korea-macos-runner)를 사용한다(AUTOMATION_GUIDE 16.1절 참고).
    # 이 러너에는 이미 Python/Chrome이 설치되어 있으므로 setup-python/setup-chrome은
    # 사용하지 않는다.
    runs-on: [self-hosted, macOS, korea]
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: automation
        run: pip3 install -r requirements.txt

      - name: Run pytest
        id: pytest
        working-directory: automation
        continue-on-error: true
        env:
          SESSION_COOKIES_JSON: ${{ secrets.SESSION_COOKIES_JSON }}
          # TC-WISHLIST-031/032는 세션 주입이 아닌 실제 로그인 UI 리디렉션을 검증하므로
          # 별도로 구글 계정 자격증명이 필요하다(self-hosted 러너가 이제 로컬 한국
          # 머신이라 봇 탐지 위험이 낮아 CI에서도 실제 로그인 사용 가능, AUTOMATION_GUIDE
          # 16.1절 참고).
          GOOGLE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_ACCOUNT_EMAIL }}
          GOOGLE_ACCOUNT_PASSWORD: ${{ secrets.GOOGLE_ACCOUNT_PASSWORD }}
        # 리포트 경로(--html/--junitxml)는 pytest.ini의 addopts가 전담한다(로컬 실행과
        # 동일한 기본값 유지, 중복 지정 방지).
        run: python3 -m pytest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            automation/reports/
            automation/screenshots/
          if-no-files-found: ignore

      - name: Notify Slack
        if: always()
        # Slack 알림 자체의 실패(웹훅 일시 오류 등)가 실제 pytest 결과와 무관하게
        # job을 실패로 만들지 않도록 한다. 실제 테스트 성공/실패 판정은 별도로
        # steps.pytest.outcome을 보는 마지막 스텝이 전담한다.
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: bash automation/scripts/notify-ci-slack.sh automation/reports/results.xml

      - name: Fail workflow if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1
